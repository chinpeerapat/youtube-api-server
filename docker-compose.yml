version: '3'

services:
  youtube-api:
    build: .
    container_name: youtube-api-server
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
      - LOG_LEVEL=INFO
      - ENABLE_AUTH=false
      - ENABLE_PROXY=false
      - WEBSHARE_PROXY_LOCATIONS=de,us
    volumes:
      - ./app:/app/app
    restart: unless-stopped
